<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: https:" />
  <title>Mido Download</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="logo" aria-hidden="true">
        <svg viewBox="0 0 24 24"><path d="M12 3v11m0 0-4.5-4.5M12 14l4.5-4.5M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2" /></svg>
      </span>
      <span class="brand-name">Mido Download</span>
    </div>
    <div class="toolbar">
      <button id="btn-add" class="btn primary" data-i18n="add"></button>
      <button id="btn-resume-all" class="btn" data-i18n="resumeAll"></button>
      <button id="btn-pause-all" class="btn" data-i18n="pauseAll"></button>
      <span class="sep"></span>
      <button id="btn-theme" class="btn icon" data-i18n-title="theme"></button>
      <button id="btn-lang" class="btn" data-i18n="langSwitch"></button>
      <button id="btn-settings" class="btn icon" data-i18n-title="settings"></button>
    </div>
  </header>

  <div class="banner" id="update-banner" hidden>
    <span id="update-text"></span>
    <button class="btn primary sm-btn" id="btn-update-install" data-i18n="restartToUpdate"></button>
  </div>
  <div class="banner info" id="afterdone-banner" hidden>
    <span id="afterdone-text"></span>
    <button class="btn sm-btn" id="btn-afterdone-off" data-i18n="cancel"></button>
  </div>

  <nav class="filters" id="filters">
    <button data-filter="all" class="chip active" data-i18n="fAll"></button>
    <button data-filter="active" class="chip" data-i18n="fActive"></button>
    <button data-filter="complete" class="chip" data-i18n="fComplete"></button>
    <button data-filter="stopped" class="chip" data-i18n="fStopped"></button>
    <span class="sep-v"></span>
    <button data-filter="video" class="chip" data-i18n="cat.video"></button>
    <button data-filter="music" class="chip" data-i18n="cat.music"></button>
    <button data-filter="programs" class="chip" data-i18n="cat.programs"></button>
    <button data-filter="compressed" class="chip" data-i18n="cat.compressed"></button>
    <button data-filter="documents" class="chip" data-i18n="cat.documents"></button>
    <span class="summary" id="summary"></span>
  </nav>

  <main>
    <table class="list">
      <thead>
        <tr>
          <th class="c-name" data-i18n="colName"></th>
          <th class="c-size" data-i18n="colSize"></th>
          <th class="c-progress" data-i18n="colProgress"></th>
          <th class="c-speed" data-i18n="colSpeed"></th>
          <th class="c-eta" data-i18n="colEta"></th>
          <th class="c-status" data-i18n="colStatus"></th>
          <th class="c-actions"></th>
        </tr>
      </thead>
      <tbody id="rows"></tbody>
    </table>
    <div class="empty" id="empty">
      <p data-i18n="emptyTitle"></p>
      <p class="hint" data-i18n="emptyHint"></p>
      <button class="btn primary" id="btn-add-empty" data-i18n="add"></button>
    </div>
  </main>

  <div class="drop-overlay" id="drop-overlay"><div data-i18n="dropHere"></div></div>

  <!-- Add download dialog -->
  <dialog id="dlg-add">
    <form method="dialog" id="form-add">
      <h2><span data-i18n="addTitle"></span> <span class="from-browser" id="add-from-browser" data-i18n="fromBrowser" hidden></span></h2>
      <label>
        <span data-i18n="url"></span>
        <div class="row">
          <input id="in-url" type="text" dir="ltr" required placeholder="https://  ·  magnet:?xt=…" />
          <button type="button" class="btn" id="btn-torrent" data-i18n="openTorrent"></button>
        </div>
      </label>
      <div class="probe" id="probe-info" hidden></div>
      <!-- YouTube / Facebook / Instagram: video preview + quality -->
      <div class="media-box" id="media-box" hidden>
        <img id="media-thumb" alt="" referrerpolicy="no-referrer" />
        <div class="media-meta">
          <div class="media-title" id="media-title" dir="auto"></div>
          <div class="media-sub" id="media-sub" dir="auto"></div>
        </div>
      </div>
      <!-- A video that is part of a YouTube playlist: offer the whole list -->
      <div class="pl-offer" id="playlist-offer" hidden>
        <span data-i18n="partOfPlaylist"></span>
        <button type="button" class="btn sm-btn" id="btn-whole-playlist" data-i18n="downloadWholePlaylist"></button>
      </div>
      <!-- A playlist: pick the videos -->
      <div class="playlist-box" id="playlist-box" hidden>
        <div class="pl-head">
          <div class="pl-meta">
            <div class="media-title" id="pl-title" dir="auto"></div>
            <div class="media-sub" id="pl-sub" dir="auto"></div>
          </div>
          <div class="pl-tools">
            <button type="button" class="btn sm-btn" id="pl-all" data-i18n="plAll"></button>
            <button type="button" class="btn sm-btn" id="pl-none" data-i18n="plNone"></button>
          </div>
        </div>
        <div class="pl-list" id="pl-list"></div>
        <div class="pl-count" id="pl-count" dir="auto"></div>
      </div>
      <label id="lbl-quality" hidden>
        <span data-i18n="quality"></span>
        <select id="in-quality"></select>
      </label>
      <label class="check" id="lbl-pl-subfolder" hidden><input type="checkbox" id="in-pl-subfolder" checked /><span data-i18n="plSubfolder"></span></label>
      <label class="check" id="lbl-pl-number" hidden><input type="checkbox" id="in-pl-number" checked /><span data-i18n="plNumber"></span></label>
      <label id="lbl-name">
        <span data-i18n="fileName"></span>
        <input id="in-name" type="text" dir="auto" data-i18n-placeholder="fileNameHint" />
      </label>
      <label>
        <span data-i18n="saveTo"></span>
        <div class="row">
          <input id="in-dir" type="text" dir="ltr" required />
          <button type="button" class="btn" id="btn-browse" data-i18n="browse"></button>
        </div>
      </label>
      <div class="grid2">
        <label id="lbl-split">
          <span data-i18n="parts"></span>
          <div class="row">
            <input id="in-split" type="range" min="1" max="16" value="8" />
            <output id="out-split">8</output>
          </div>
        </label>
        <label>
          <span data-i18n="speedLimitFile"></span>
          <input id="in-limit" type="number" min="0" step="50" value="0" dir="ltr" />
        </label>
      </div>
      <label id="lbl-checksum">
        <span data-i18n="checksumOptional"></span>
        <input id="in-checksum" type="text" dir="ltr" data-i18n-placeholder="checksumHint" />
      </label>
      <p class="error" id="add-error"></p>
      <div class="actions">
        <button type="button" class="btn" id="btn-add-cancel" data-i18n="cancel"></button>
        <button type="submit" class="btn primary" data-i18n="start"></button>
      </div>
    </form>
  </dialog>

  <!-- Per-download speed limit -->
  <dialog id="dlg-limit">
    <form method="dialog">
      <h2 data-i18n="speedLimitTitle"></h2>
      <p id="limit-name" class="muted" dir="auto"></p>
      <label>
        <span data-i18n="speedLimitFile"></span>
        <input id="in-item-limit" type="number" min="0" step="50" dir="ltr" />
      </label>
      <div class="actions">
        <button value="cancel" class="btn" data-i18n="cancel"></button>
        <button value="ok" class="btn primary" data-i18n="save"></button>
      </div>
    </form>
  </dialog>

  <!-- Delete confirmation -->
  <dialog id="dlg-remove">
    <form method="dialog">
      <h2 data-i18n="removeTitle"></h2>
      <p id="remove-name" class="muted" dir="auto"></p>
      <label class="check">
        <input type="checkbox" id="in-delete-file" />
        <span data-i18n="deleteFileToo"></span>
      </label>
      <div class="actions">
        <button value="cancel" class="btn" data-i18n="cancel"></button>
        <button value="ok" class="btn danger" data-i18n="remove"></button>
      </div>
    </form>
  </dialog>

  <!-- Countdown before quit / sleep / shutdown -->
  <dialog id="dlg-power">
    <form method="dialog">
      <h2 id="power-title"></h2>
      <p class="countdown" id="power-count"></p>
      <div class="actions">
        <button value="cancel" class="btn primary" id="btn-power-cancel" data-i18n="cancel"></button>
      </div>
    </form>
  </dialog>

  <!-- Verify a finished file -->
  <dialog id="dlg-verify" class="wide">
    <form method="dialog">
      <h2 data-i18n="verifyTitle"></h2>
      <p id="verify-name" class="muted" dir="auto"></p>
      <label>
        <span data-i18n="verifyAlgo"></span>
        <select id="verify-algo">
          <option value="sha-256">SHA-256</option>
          <option value="sha-1">SHA-1</option>
          <option value="md5">MD5</option>
          <option value="sha-512">SHA-512</option>
        </select>
      </label>
      <label>
        <span data-i18n="verifyResult"></span>
        <input id="verify-hash" type="text" dir="ltr" readonly />
      </label>
      <label>
        <span data-i18n="verifyCompare"></span>
        <input id="verify-expected" type="text" dir="ltr" data-i18n-placeholder="checksumHint" />
      </label>
      <p class="verify-outcome" id="verify-outcome"></p>
      <div class="actions">
        <button type="button" class="btn" id="btn-verify-copy" data-i18n="copy"></button>
        <button value="close" class="btn primary" data-i18n="close"></button>
      </div>
    </form>
  </dialog>

  <!-- Browser extension pairing request -->
  <dialog id="dlg-pair">
    <form method="dialog">
      <h2 data-i18n="pairTitle"></h2>
      <p data-i18n="pairText"></p>
      <p class="pair-name" id="pair-name" dir="auto"></p>
      <p class="hint" data-i18n="pairHint"></p>
      <div class="actions">
        <button value="deny" class="btn" data-i18n="deny"></button>
        <button value="allow" class="btn primary" id="btn-pair-allow" data-i18n="allow"></button>
      </div>
    </form>
  </dialog>

  <!-- Settings -->
  <dialog id="dlg-settings" class="wide">
    <form method="dialog" id="form-settings">
      <h2 data-i18n="settings"></h2>
      <div class="tabs" role="tablist">
        <button type="button" class="tab active" data-tab="general" data-i18n="tabGeneral"></button>
        <button type="button" class="tab" data-tab="connection" data-i18n="tabConnection"></button>
        <button type="button" class="tab" data-tab="logins" data-i18n="tabLogins"></button>
        <button type="button" class="tab" data-tab="browser" data-i18n="tabBrowser"></button>
        <button type="button" class="tab" data-tab="schedule" data-i18n="tabSchedule"></button>
      </div>

      <section class="pane" data-pane="general">
        <label>
          <span data-i18n="defaultDir"></span>
          <div class="row">
            <input id="s-dir" type="text" dir="ltr" />
            <button type="button" class="btn" id="s-browse" data-i18n="browse"></button>
          </div>
        </label>
        <label class="check"><input type="checkbox" id="s-categorize" /><span data-i18n="categorize"></span></label>
        <p class="hint" data-i18n="categorizeHint"></p>
        <label>
          <span data-i18n="mediaQualityDefault"></span>
          <select id="s-media-quality">
            <option value="best" data-i18n="qBest"></option>
            <option value="2160">2160p (4K)</option>
            <option value="1440">1440p</option>
            <option value="1080">1080p</option>
            <option value="720">720p</option>
            <option value="480">480p</option>
            <option value="360">360p</option>
            <option value="mp3" data-i18n="qMp3"></option>
            <option value="m4a" data-i18n="qM4a"></option>
          </select>
        </label>
        <div class="row">
          <span class="hint" id="s-ytdlp-status"></span>
          <button type="button" class="btn sm-btn" id="s-ytdlp-update" data-i18n="updateYtdlp"></button>
        </div>
        <label class="check"><input type="checkbox" id="s-clipboard" /><span data-i18n="clipboardWatch"></span></label>
        <label class="check"><input type="checkbox" id="s-notifications" /><span data-i18n="notifications"></span></label>
        <label class="check"><input type="checkbox" id="s-tray" /><span data-i18n="closeToTray"></span></label>
      </section>

      <section class="pane" data-pane="connection" hidden>
        <div class="grid2">
          <label><span data-i18n="maxConcurrent"></span><input id="s-concurrent" type="number" min="1" max="20" dir="ltr" /></label>
          <label><span data-i18n="defaultParts"></span><input id="s-split" type="number" min="1" max="16" dir="ltr" /></label>
          <label><span data-i18n="speedLimitAll"></span><input id="s-limit" type="number" min="0" step="50" dir="ltr" /></label>
          <label><span data-i18n="retryMax"></span><input id="s-retry-max" type="number" min="0" max="100" dir="ltr" /></label>
        </div>
        <label class="check"><input type="checkbox" id="s-retry" /><span data-i18n="autoRetry"></span></label>
        <label>
          <span data-i18n="proxy"></span>
          <input id="s-proxy" type="text" dir="ltr" placeholder="http://127.0.0.1:8080" />
        </label>
        <label>
          <span data-i18n="userAgent"></span>
          <input id="s-ua" type="text" dir="ltr" placeholder="Mido-Download/0.5" />
        </label>
      </section>

      <section class="pane" data-pane="logins" hidden>
        <p class="hint" data-i18n="loginsHint"></p>
        <div id="s-logins" class="logins"></div>
        <button type="button" class="btn" id="s-add-login" data-i18n="addLogin"></button>
      </section>

      <section class="pane" data-pane="browser" hidden>
        <label class="check"><input type="checkbox" id="s-browser" /><span data-i18n="browserEnabled"></span></label>
        <label class="check"><input type="checkbox" id="s-browser-ask" /><span data-i18n="browserAsk"></span></label>
        <p class="hint" id="s-bridge-status"></p>
        <h3 data-i18n="pairedBrowsers"></h3>
        <div id="s-clients" class="clients"></div>
        <p class="hint" data-i18n="extensionHowTo"></p>
        <button type="button" class="btn" id="s-ext-folder" data-i18n="openExtFolder"></button>
      </section>

      <section class="pane" data-pane="schedule" hidden>
        <label class="check"><input type="checkbox" id="s-sched" /><span data-i18n="scheduleEnabled"></span></label>
        <div class="grid2">
          <label><span data-i18n="scheduleStart"></span><input id="s-sched-start" type="time" dir="ltr" /></label>
          <label><span data-i18n="scheduleStop"></span><input id="s-sched-stop" type="time" dir="ltr" /></label>
        </div>
        <div>
          <span class="field-label" data-i18n="scheduleDays"></span>
          <div class="days" id="s-sched-days"></div>
        </div>
        <p class="hint" data-i18n="scheduleHint"></p>
        <label>
          <span data-i18n="afterDone"></span>
          <select id="s-afterdone">
            <option value="nothing" data-i18n="adNothing"></option>
            <option value="quit" data-i18n="adQuit"></option>
            <option value="sleep" data-i18n="adSleep"></option>
            <option value="shutdown" data-i18n="adShutdown"></option>
          </select>
        </label>
        <p class="hint" data-i18n="afterDoneHint"></p>
        <h3 data-i18n="updates"></h3>
        <label class="check"><input type="checkbox" id="s-autoupdate" /><span data-i18n="autoUpdate"></span></label>
        <div class="row">
          <button type="button" class="btn" id="s-check-update" data-i18n="checkNow"></button>
          <span class="hint" id="s-update-status"></span>
        </div>
      </section>

      <div class="actions">
        <button value="cancel" class="btn" data-i18n="cancel"></button>
        <button value="ok" class="btn primary" data-i18n="save"></button>
      </div>
    </form>
  </dialog>

  <script src="i18n.js"></script>
  <script src="format.js"></script>
  <script src="app.js"></script>
</body>
</html>
