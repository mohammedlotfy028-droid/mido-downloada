<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <header>
    <img src="icons/32.png" width="24" height="24" alt="" />
    <strong data-msg="extName"></strong>
  </header>

  <section class="status" id="status">
    <span class="dot" id="dot"></span>
    <span id="status-text"></span>
  </section>
  <button id="btn-connect" class="btn primary" data-msg="connect" hidden></button>

  <!-- On a YouTube / Facebook / Instagram … video page -->
  <section class="page-video" id="page-video" hidden>
    <div class="pv-site" id="pv-site"></div>
    <div class="pv-title" id="pv-title" dir="auto"></div>
    <button id="btn-page" class="btn primary" data-msg="downloadThisVideo"></button>
  </section>

  <label class="toggle">
    <input type="checkbox" id="capture" />
    <span data-msg="captureToggle"></span>
  </label>

  <h2 id="media-heading" data-msg="mediaTitle"></h2>
  <ul id="media"></ul>
  <p class="empty" id="media-empty" data-msg="mediaEmpty" hidden></p>

  <script src="popup.js"></script>
</body>
</html>
