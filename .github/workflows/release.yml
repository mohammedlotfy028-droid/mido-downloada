# Builds the Windows installer and publishes a GitHub Release when a version tag is pushed.
#   git tag v0.4.0 && git push origin v0.4.0
# The installed app checks these releases for automatic updates (latest.yml).
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write # create the release and upload files

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Check the tag matches package.json
        shell: bash
        run: |
          v=$(node -p "require('./package.json').version")
          [ "v$v" = "${GITHUB_REF_NAME}" ] || { echo "Tag ${GITHUB_REF_NAME} but package.json says $v"; exit 1; }

      - name: Get aria2 (official release)
        run: npm run fetch-aria2

      - name: Engine test
        run: node test/engine-test.js

      - name: Build installer and publish release
        run: npm run dist:publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Zip the browser extension
        shell: pwsh
        run: Compress-Archive -Path extension\* -DestinationPath "dist\mido-download-extension-${{ github.ref_name }}.zip"

      - name: Attach the extension to the release
        shell: bash
        run: gh release upload "${GITHUB_REF_NAME}" dist/mido-download-extension-*.zip --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
