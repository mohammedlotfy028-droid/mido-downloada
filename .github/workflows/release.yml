# Builds the Windows installer and publishes a GitHub Release when a version tag is pushed.
#   git tag v0.4.0 && git push origin v0.4.0
# The installed app checks these releases for automatic updates (latest.yml).
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write # create the release and upload files

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Check the tag matches package.json
        shell: bash
        run: |
          v=$(node -p "require('./package.json').version")
          [ "v$v" = "${GITHUB_REF_NAME}" ] || { echo "Tag ${GITHUB_REF_NAME} but package.json says $v"; exit 1; }

      - name: Get aria2 (official release)
        run: npm run fetch-aria2

      - name: Get yt-dlp and ffmpeg (official builds, for video sites)
        run: npm run fetch-media-tools

      - name: Engine test
        run: node test/engine-test.js

      # electron-builder's own GitHub publisher sometimes "succeeds" without uploading every
      # file (v0.4.0 lacked the blockmap, v0.6.1 lacked the installer), so we only build with it
      # and upload + verify the files ourselves.
      - name: Build installer
        run: npm run dist:ci

      - name: Zip the browser extension
        shell: pwsh
        run: Compress-Archive -Path extension\* -DestinationPath "dist\mido-download-extension-${{ github.ref_name }}.zip"

      - name: Publish the release and check every file arrived
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          v="${GITHUB_REF_NAME#v}"
          files=("dist/Mido-Download-Setup-$v.exe" "dist/Mido-Download-Setup-$v.exe.blockmap" "dist/latest.yml" "dist/mido-download-extension-${GITHUB_REF_NAME}.zip")
          for f in "${files[@]}"; do [ -s "$f" ] || { echo "missing build output: $f"; exit 1; }; done
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --title "Mido Download $GITHUB_REF_NAME" --generate-notes
          gh release upload "$GITHUB_REF_NAME" "${files[@]}" --clobber
          # Verify: every file must now be an asset of the release, with the right size.
          gh release view "$GITHUB_REF_NAME" --json assets --jq '.assets[] | "\(.name) \(.size)"' | sort > uploaded.txt
          cat uploaded.txt
          for f in "${files[@]}"; do
            name=$(basename "$f"); size=$(stat -c %s "$f")
            grep -qx "$name $size" uploaded.txt || { echo "not uploaded correctly: $name ($size bytes)"; exit 1; }
          done
